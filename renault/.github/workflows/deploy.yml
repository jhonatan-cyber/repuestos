name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma schemas
        run: bun run schema:generate

      - name: Generate Prisma clients
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env' --exclude='node_modules' --exclude='.git' --exclude='prisma/renault.db' --exclude='dist'
          path: ./
          remote_path: ${{ secrets.VPS_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT || '22' }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Post-deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            bun install --frozen-lockfile --production
            bun run db:generate
            # Backup pre-deploy: no bloquea el deploy si pg_dump no está disponible
            pg_dump "$DATABASE_URL" -Fc -f "backup-pre-deploy-$(date +%Y%m%d-%H%M%S).dump" || echo "pg_dump omitido"
            bun run db:migrate:deploy:postgres
            pm2 restart renault-web || pm2 start ecosystem.config.js --only renault-web
